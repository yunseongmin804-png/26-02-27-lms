<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
<div th:replace="~{fragments/common :: pageHeader('공지사항', ${loginUser})}"></div>
<p class="msg" th:if="${message != null}" th:text="${message}"></p>

<div class="box">
    <form class="row" th:action="@{/notices}" method="get">
        <input name="keyword" th:value="${keyword}" placeholder="제목/내용 검색">
        <select name="sort">
            <option value="latest" th:selected="${sort == 'latest'}">최신순</option>
            <option value="oldest" th:selected="${sort == 'oldest'}">오래된순</option>
        </select>
        <button type="submit">검색</button>
    </form>
</div>

<div class="box" th:if="${loginUser.role == 'ADMIN' or loginUser.role == 'INSTRUCTOR'}">
    <h3>공지 등록</h3>
    <form th:action="@{/notices}" method="post" style="display:grid;gap:8px;max-width:700px;">
        <input name="title" placeholder="제목" required th:value="${draftTitle}">
        <textarea name="content" rows="4" placeholder="내용" required th:text="${draftContent}"></textarea>
        <button type="submit">등록</button>
    </form>
</div>

<div class="box">
<table>
    <thead><tr><th>ID</th><th>제목</th><th>내용</th><th>작성자</th><th>작성일</th><th>상세</th></tr></thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(notices)}"><td colspan="6">등록된 공지 없음</td></tr>
    <tr th:each="n : ${notices}">
        <td th:text="${n.id}"></td>
        <td th:text="${n.title}"></td>
        <td th:text="${n.content}"></td>
        <td th:text="${n.authorName}"></td>
        <td th:text="${#temporals.format(n.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td><a th:href="@{|/notices/${n.id}|}">열기</a></td>
    </tr>
    </tbody>
</table>
</div>

<div class="pager">
    <a th:if="${page > 1}" th:href="@{/notices(page=${page-1},size=${size},keyword=${keyword},sort=${sort})}">이전</a>
    <span th:text="|${page}/${totalPages} 페이지 (총 ${totalCount}건)|"></span>
    <a th:if="${page < totalPages}" th:href="@{/notices(page=${page+1},size=${size},keyword=${keyword},sort=${sort})}">다음</a>
</div>
</div>
</body>
</html>
