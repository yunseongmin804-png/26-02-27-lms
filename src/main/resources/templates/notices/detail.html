<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지 상세</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <div th:replace="~{fragments/common :: pageHeader('공지 상세', ${loginUser})}"></div>

    <div class="box">
        <h2 th:text="${notice.title}"></h2>
        <p class="muted">
            작성자: <b th:text="${notice.authorName}"></b> ·
            작성일: <span th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
        </p>
        <div style="white-space:pre-wrap;border:1px solid #dbe5f1;border-radius:10px;padding:12px;" th:text="${notice.content}"></div>

        <div class="row" style="margin-top:12px;" th:if="${loginUser.role == 'ADMIN' or loginUser.role == 'INSTRUCTOR'}">
            <a th:href="@{|/notices/${notice.id}/edit|}">수정</a>
            <form th:action="@{|/notices/${notice.id}/delete|}" method="post" onsubmit="return confirm('공지사항을 삭제할까요?');">
                <button type="submit" class="danger">삭제</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
