<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>공지 상세</title></head>
<body style="font-family:sans-serif;margin:32px;">
<h1>공지 상세</h1>
<p><a th:href="@{/notices}">목록</a> | <a th:href="@{/}">홈</a></p>

<h2 th:text="${notice.title}"></h2>
<p><b>작성자:</b> <span th:text="${notice.authorName}"></span></p>
<div style="border:1px solid #ddd;padding:12px;border-radius:8px;max-width:900px;white-space:pre-wrap;" th:text="${notice.content}"></div>

<div style="margin-top:12px;" th:if="${loginUser.role == 'ADMIN' or loginUser.role == 'INSTRUCTOR'}">
    <a th:href="@{|/notices/${notice.id}/edit|}">수정</a>
    <form th:action="@{|/notices/${notice.id}/delete|}" method="post" style="display:inline;">
        <button type="submit" onclick="return confirm('삭제할까요?')">삭제</button>
    </form>
</div>
</body>
</html>
