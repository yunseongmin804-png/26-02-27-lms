<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>강의 등록</title></head>
<body style="font-family:sans-serif;margin:40px;">
<h1>강의 등록</h1>
<form th:action="@{/courses}" method="post" style="width:500px;display:grid;gap:10px;">
    <input name="title" placeholder="강의명" required>
    <input name="category" placeholder="카테고리" required>
    <input name="instructorName" placeholder="강사명" required>
    <input name="capacity" type="number" min="1" required>
    <button type="submit">등록</button>
</form>
<p><a th:href="@{/courses}">목록으로</a></p>
</body>
</html>
