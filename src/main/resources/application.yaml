spring:
  application:
    name: lms

  profiles:
    active: local

  thymeleaf:
    cache: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 30MB

logging:
  level:
    org.springframework.jdbc.core: DEBUG

chatbot:
  gateway:
    url: ${OPENCLAW_CHAT_URL:http://127.0.0.1:18789/v1/chat/completions}
    token: ${OPENCLAW_GATEWAY_TOKEN:}
    model: ${OPENCLAW_CHAT_MODEL:openai-codex/gpt-5.3-codex}
